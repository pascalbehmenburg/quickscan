<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>quickscan</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="hint">
          <span id="hint-text">starting camera…</span>
        </div>
        <div id="flash"></div>
      </section>

      <aside id="side">
        <header>
          <div class="head-top">
            <h1>quickscan</h1>
            <span id="conn-state">booting</span>
          </div>
          <div id="mode-toggle" role="group" aria-label="Capture mode">
            <button type="button" data-mode="single" data-active="true">Single</button>
            <button type="button" data-mode="group">Group</button>
          </div>
        </header>
        <section id="draft" hidden>
          <div class="draft-head">
            <span class="draft-title">Group draft</span>
            <span id="draft-count" class="draft-count">0 pages</span>
          </div>
          <ol id="draft-pages"></ol>
          <button type="button" id="confirm-group" disabled>Upload group</button>
        </section>
        <ol id="queue"></ol>
        <footer>
          <button id="capture" type="button">Capture</button>
        </footer>
      </aside>
    </main>

    <script type="module" src="./frontend.ts"></script>
  </body>
</html>
