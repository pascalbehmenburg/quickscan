<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>quickscan</title>
    <link rel="stylesheet" href="./styles.css" />
    <script async src="https://docs.opencv.org/4.10.0/opencv.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jscanify@1.3.0/src/jscanify.js"></script>
  </head>
  <body>
    <main>
      <section id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="hint">
          <span id="hint-text">starting camera…</span>
        </div>
        <div id="flash"></div>
      </section>

      <aside id="side">
        <header>
          <h1>quickscan</h1>
          <span id="conn-state">booting</span>
        </header>
        <ol id="queue"></ol>
        <footer>
          <button id="capture" type="button">Capture</button>
        </footer>
      </aside>
    </main>

    <canvas id="work" hidden></canvas>
    <script type="module" src="./frontend.ts"></script>
  </body>
</html>
